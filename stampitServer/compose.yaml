version: '3.8'

services:
  stampitServer:
    image: 'stampit_server:latest'
    environment:
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - CONTEST_IMG_PATH=${CONTEST_IMG_PATH}
      - CONTEST_URL=${CONTEST_URL}
    ports:
      - '8080:8080'
#  mongodb:
#    image: 'mongo:latest'
#    environment:
#      - 'MONGO_INITDB_DATABASE=mydatabase'
#      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
#      - 'MONGO_INITDB_ROOT_USERNAME=root'
#    ports:
#      - '27017'
  mysql:
    image: 'mysql:latest'
    environment:
      - MYSQL_DATABASE=contest
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_USER=${DATABASE_USER}
    ports:
      - '3306:3306'
    volumes:
      - mysql:/var/lib/mysql
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - '80:80'
    depends_on:
      - stampitServer

# 데이터 지속성을 위한 볼륨 추가
volumes:
  mysql:
