spring:
  datasource:
    url: jdbc:mysql://mysql/contest
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

img:
  contest: ${CONTEST_IMG_PATH}

contest:
  url: ${CONTEST_URL}
